[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jlink-ppk2-mcp"
version = "0.1.0"
description = "MCP-Server für Nordic PPK2 und SEGGER J-Link"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.27.0",
    "ppk2-api>=0.9.2",
    "pylink-square>=2.0.1",
]

[project.scripts]
jlink-ppk2-mcp = "jlink_ppk2_mcp.main:main"

[tool.hatch.build.targets.wheel]
packages = ["jlink_ppk2_mcp"]
